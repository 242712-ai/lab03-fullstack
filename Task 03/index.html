<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shopping Discount System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card shopping-card">

        <!-- Header -->
        <div class="card-header">
            <h2>Online Shopping Order Summary</h2>
            <p>Electronic Products & Discount System</p>
        </div>

        <div class="card-body p-4">

            <!-- Product Information -->
            <h4 class="section-title">Product Information</h4>

            <div class="row g-3">

                <!-- Product -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">
                        Product
                    </label>

                    <select id="product"
                            class="form-select"
                            onchange="calculateBill()">

                        <option value="Laptop" data-price="120000">
                            Laptop - Rs. 120,000
                        </option>

                        <option value="Smartphone" data-price="80000">
                            Smartphone - Rs. 80,000
                        </option>

                        <option value="Tablet" data-price="50000">
                            Tablet - Rs. 50,000
                        </option>

                        <option value="Headphones" data-price="15000">
                            Headphones - Rs. 15,000
                        </option>

                        <option value="Smart Watch" data-price="25000">
                            Smart Watch - Rs. 25,000
                        </option>

                    </select>
                </div>


                <!-- Quantity -->
                <div class="col-md-6">

                    <label class="form-label fw-bold">
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           class="form-control"
                           value="1"
                           min="1"
                           oninput="calculateBill()">

                </div>


                <!-- Customer Type -->
                <div class="col-md-6">

                    <label class="form-label fw-bold">
                        Customer Type
                    </label>

                    <select id="customerType"
                            class="form-select"
                            onchange="calculateBill()">

                        <option value="Regular">
                            Regular Customer
                        </option>

                        <option value="Premium">
                            Premium Customer
                        </option>

                    </select>

                </div>

            </div>


            <hr class="my-4">


            <!-- Order Summary -->
            <h4 class="section-title">
                Order Summary
            </h4>

            <div class="summary-box">

                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Product:</strong>
                    </div>

                    <div class="col-6 text-end"
                         id="summaryProduct">
                        Laptop
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Quantity:</strong>
                    </div>

                    <div class="col-6 text-end"
                         id="summaryQuantity">
                        1
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Unit Price:</strong>
                    </div>

                    <div class="col-6 text-end"
                         id="unitPrice">
                        Rs. 120,000
                    </div>
                </div>


                <hr>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Subtotal:</strong>
                    </div>

                    <div class="col-6 text-end"
                         id="subtotal">
                        Rs. 120,000
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Discount:</strong>
                    </div>

                    <div class="col-6 text-end discount-text"
                         id="discount">
                        0%
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Discount Amount:</strong>
                    </div>

                    <div class="col-6 text-end discount-text"
                         id="discountAmount">
                        Rs. 0
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-6">
                        <strong>Delivery Charges:</strong>
                    </div>

                    <div class="col-6 text-end"
                         id="delivery">
                        Rs. 2,000
                    </div>
                </div>


                <hr>


                <div class="row">

                    <div class="col-6">
                        <strong>Final Payable Amount:</strong>
                    </div>

                    <div class="col-6 text-end final-amount"
                         id="finalAmount">
                        Rs. 122,000
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>
