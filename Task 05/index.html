
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Parking Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>Smart Campus Parking Management</h1>
        <p>University Parking Access & Decision System</p>
    </header>

    <div class="container">

        <div class="parking-card">

            <!-- Vehicle Information -->
            <h3 class="section-title">Vehicle Information</h3>

            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label">Vehicle Owner Type</label>

                    <select id="ownerType" class="form-select">
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Staff">Staff</option>
                        <option value="Visitor">Visitor</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Vehicle Type</label>

                    <select id="vehicleType" class="form-select">
                        <option value="Car">Car</option>
                        <option value="Motorcycle">Motorcycle</option>
                        <option value="Van">Van</option>
                    </select>
                </div>

            </div>


            <!-- Parking Area -->
            <h3 class="section-title">Parking Area</h3>

            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label">Parking Area</label>

                    <select id="parkingArea" class="form-select">
                        <option value="Faculty Parking">
                            Faculty Parking
                        </option>

                        <option value="Student Parking">
                            Student Parking
                        </option>

                        <option value="Visitor Parking">
                            Visitor Parking
                        </option>

                        <option value="Staff Parking">
                            Staff Parking
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Available Spaces</label>

                    <input type="number"
                           id="availableSpaces"
                           class="form-control"
                           value="10"
                           min="0">
                </div>

            </div>


            <!-- Access Information -->
            <h3 class="section-title">Access Information</h3>

            <div class="row g-3 mb-4">

                <div class="col-md-6">
                    <label class="form-label">University ID</label>

                    <select id="universityId" class="form-select">
                        <option value="Valid">Valid</option>
                        <option value="Invalid">Invalid</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Parking Permit</label>

                    <select id="permit" class="form-select">
                        <option value="Valid">Valid</option>
                        <option value="Invalid">Invalid</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Parking Time</label>

                    <select id="parkingTime" class="form-select">
                        <option value="Day">
                            Day Time (8 AM - 6 PM)
                        </option>

                        <option value="Night">
                            Night Time (6 PM - 8 AM)
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        Special Access Permission
                    </label>

                    <select id="specialPermission" class="form-select">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

            </div>


            <!-- Current Information -->
            <h3 class="section-title">Parking Information</h3>

            <div class="row g-3 mb-4">

                <div class="col-md-4">
                    <div class="info-card">
                        <h5>Vehicle Owner</h5>
                        <p id="displayOwner">Student</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-card">
                        <h5>Parking Area</h5>
                        <p id="displayArea">Faculty Parking</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="info-card">
                        <h5>Available Spaces</h5>
                        <p id="displaySpaces">10</p>
                    </div>
                </div>

            </div>


            <!-- Button -->
            <div class="text-center">
                <button onclick="checkParking()"
                        class="btn btn-primary btn-lg">
                    Check Parking Access
                </button>
            </div>


            <!-- Final Decision -->
            <div id="decisionBox"
                 class="decision-box approved">
                Parking Approved
            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p>Smart Campus Parking Management System</p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
