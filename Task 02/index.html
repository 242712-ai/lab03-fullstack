
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Registration Eligibility System</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>University Course Registration</h1>

    <p class="subtitle">
        Course Registration Eligibility System
    </p>

    <!-- Student Information -->
    <div class="section">

        <h2>Student Information</h2>

        <div class="form-grid">

            <div>
                <label>Student Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter student name">
            </div>

            <div>
                <label>Student ID</label>
                <input type="text" id="studentId"
                       placeholder="Enter student ID">
            </div>

            <div>
                <label>Current Semester</label>
                <input type="number" id="semester"
                       placeholder="Enter semester">
            </div>

            <div>
                <label>CGPA</label>
                <input type="number" id="cgpa"
                       step="0.01"
                       min="0"
                       max="4"
                       placeholder="Example: 3.20">
            </div>

            <div>
                <label>Academic Standing</label>

                <select id="standing">
                    <option value="good">Good Standing</option>
                    <option value="warning">Academic Warning</option>
                    <option value="probation">Academic Probation</option>
                </select>
            </div>

            <div>
                <label>Fee / Payment Status</label>

                <select id="feeStatus">
                    <option value="paid">Paid / Clear</option>
                    <option value="unpaid">Unresolved Fee Issue</option>
                </select>
            </div>

        </div>
    </div>


    <!-- Course Information -->
    <div class="section">

        <h2>Course Information</h2>

        <div class="form-grid">

            <div>
                <label>Course Name</label>

                <input type="text"
                       id="courseName"
                       value="Advanced Web Development">
            </div>

            <div>
                <label>Required Semester</label>

                <input type="number"
                       id="requiredSemester"
                       value="5">
            </div>

            <div>
                <label>Minimum CGPA</label>

                <input type="number"
                       id="requiredCgpa"
                       value="2.50"
                       step="0.01">
            </div>

            <div>
                <label>Prerequisite Course</label>

                <input type="text"
                       id="prerequisite"
                       value="Web Development">
            </div>

            <div>
                <label>Prerequisite Status</label>

                <select id="prerequisiteStatus">

                    <option value="completed">
                        Completed
                    </option>

                    <option value="incomplete">
                        Incomplete
                    </option>

                </select>
            </div>

            <div>
                <label>Course Availability</label>

                <select id="availability">

                    <option value="available">
                        Available
                    </option>

                    <option value="unavailable">
                        Unavailable
                    </option>

                </select>
            </div>

        </div>
    </div>


    <!-- Previous Performance -->

    <div class="section">

        <h2>Previous Course Performance</h2>

        <label>Previous Course Grade</label>

        <select id="previousGrade">

            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>

        </select>

    </div>


    <!-- Button -->

    <button onclick="checkEligibility()">
        Check Registration Eligibility
    </button>


    <!-- Result -->

    <div id="result">

        <h2 id="resultTitle"></h2>

        <p id="studentResult"></p>

        <h3>Eligibility Details:</h3>

        <ul id="reasonList"></ul>

    </div>

</div>


<!-- JavaScript File -->
<script src="script.js"></script>

</body>
</html>
